[project]
name = "audio-server"
version = "0.0.0"
requires-python = ">=3.9,<3.10"
dependencies = [
  "websockets",
  "numpy<2",
  "httpx",
  "webrtcvad",
  "openai-whisper",
  "numba>=0.59,<0.60",
  "typing-extensions",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.uv]
# Keep uv files local to server/ for the monorepo.

