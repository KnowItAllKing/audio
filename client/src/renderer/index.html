<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audio Transcription Client</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #121a33;
        --text: #e8ecff;
        --muted: #9aa6d6;
        --border: rgba(255, 255, 255, 0.12);
        --good: #2dd4bf;
        --bad: #fb7185;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .app {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 12px;
        padding: 18px;
        height: 100%;
        box-sizing: border-box;
        overflow: hidden;
      }
      .header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .title {
        font-size: 20px;
        font-weight: 650;
      }
      .subtle {
        color: var(--muted);
        font-size: 12px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      input,
      select,
      button {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        outline: none;
      }
      button {
        cursor: pointer;
        font-weight: 600;
      }
      button.primary {
        border-color: rgba(45, 212, 191, 0.5);
        background: rgba(45, 212, 191, 0.15);
      }
      button.danger {
        border-color: rgba(251, 113, 133, 0.55);
        background: rgba(251, 113, 133, 0.12);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
        align-items: end;
      }
      .transcript {
        min-height: 0;
        overflow-y: auto;
        padding: 12px;
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--border);
        border-radius: 12px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          "Liberation Mono", "Courier New", monospace;
        font-size: 12px;
        white-space: pre-wrap;
      }
      .statusbar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 12px;
      }
      .pill {
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      .pill.good {
        color: var(--good);
        border-color: rgba(45, 212, 191, 0.35);
      }
      .pill.bad {
        color: var(--bad);
        border-color: rgba(251, 113, 133, 0.45);
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <div>
          <div class="title">Audio Transcription Client</div>
          <div class="subtle">Streams mic + “system” (selected input device) over WebSockets.</div>
        </div>
        <div class="subtle">Phase 4</div>
      </div>

      <div class="panel">
        <div class="grid">
          <div>
            <label for="wsUrl">WebSocket URL</label>
            <input id="wsUrl" type="text" value="ws://localhost:8765" />
          </div>
          <div>
            <label for="sessionId">Session ID</label>
            <input id="sessionId" type="text" />
          </div>
        </div>

        <div style="height: 12px"></div>

        <div class="grid">
          <div>
            <label for="micSelect">Mic device</label>
            <select id="micSelect"></select>
          </div>
          <div>
            <label for="sysSelect">System device (virtual input)</label>
            <select id="sysSelect"></select>
          </div>
        </div>

        <div style="height: 12px"></div>

        <div class="row">
          <button id="refreshBtn">Refresh devices</button>
          <button id="startBtn" class="primary">Connect &amp; Start</button>
          <button id="stopBtn" class="danger" disabled>Stop</button>
        </div>
      </div>

      <div class="panel" style="display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; overflow: hidden">
        <div class="subtle">Transcript</div>
        <div id="transcript" class="transcript"></div>
      </div>

      <div class="statusbar">
        <div>
          Connection:
          <span id="connStatus" class="pill">Disconnected</span>
          <span style="margin-left: 8px">Last update:</span>
          <span id="lastUpdate" class="pill">—</span>
        </div>
        <div>
          Sent:
          <span id="sentStats" class="pill">mic=0 sys=0</span>
          <span style="margin-left: 8px">Received:</span>
          <span id="recvStats" class="pill">0</span>
        </div>
      </div>
    </div>

    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
